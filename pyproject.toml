[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-studio"
version = "1.0.0"
description = "MLB Studio V1.0 â€” visual model studio for MLBricks in Jupyter, Kaggle and Colab."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

authors = [
  { name = "Zameer Hussain" },
  { name = "Akhtar Hussain" }
]

dependencies = [
  "ipython>=8,<10",
  "ipywidgets>=8,<9",
  "huggingface_hub>=0.24,<2",
]

[project.urls]
Homepage = "https://github.com/MlBricks/MLBricks-Studio"
Repository = "https://github.com/MlBricks/MLBricks-Studio"
Issues = "https://github.com/MlBricks/MLBricks-Studio/issues"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0"
"MLBricks" = "https://github.com/MlBricks/MLBricks"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlb_studio*"]

[tool.setuptools.package-data]
mlb_studio = ["static/*.js", "static/*.css", "*.json"]


[project.optional-dependencies]
data = [
  "datasets>=2.18,<5",
  "kagglehub>=0.3,<1",
  "transformers>=4.40,<6",
  "pandas>=2,<4",
  "pyarrow>=15,<23",
  "pillow>=10,<13",
  "numpy>=1.26,<3"
]

cloud = [
  "boto3>=1.34,<2",
  "google-cloud-storage>=2.16,<4",
  "google-auth>=2.29,<3",
  "azure-storage-blob>=12.20,<13"
]

serve = [
  "pyngrok>=7.2,<8"
]


dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
]

[tool.pytest.ini_options]
markers = [
  "integration: tests that require the pinned MLBricks runtime",
]


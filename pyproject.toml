[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbricks-studio"
version = "1.0.0b2"
description = "MLB Studio V1.0 Beta â€” visual model studio for MLBricks across local Python, Jupyter, Kaggle and Colab."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

authors = [
  { name = "Zameer Hussain" },
  { name = "Akhtar Hussain" }
]

dependencies = [
  "mlbricks-kit==1.0.0b2",
  "ipython>=7.34,<10",
  "ipywidgets>=8,<9",
  "huggingface_hub>=0.24,<2",
  "datasets>=2.18,<5",
  "kagglehub>=0.3,<1",
  "transformers>=4.40,<6",
  "pandas>=2,<4",
  "pyarrow>=15,<23",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "torch>=2.2",
  "keyring>=25,<27"
]

[project.scripts]
mlbricks-studio = "mlbstudio.cli:main"
mlb-studio = "mlbstudio.cli:main"

[project.urls]
Homepage = "https://github.com/MlBricks/MLBricks-Studio"
Repository = "https://github.com/MlBricks/MLBricks-Studio"
Issues = "https://github.com/MlBricks/MLBricks-Studio/issues"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0"
"MLBricks" = "https://github.com/MlBricks/MLBricks"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlb_studio*", "mlbstudio*"]

[tool.setuptools.package-data]
mlb_studio = ["static/*.js", "static/*.css", "static/*.svg", "static/*.png", "static/*.ico", "*.json"]


[project.optional-dependencies]
# Backward-compatible extra. Data Processing dependencies are now installed
# by default so Tokenize Text and Workshop data pipelines work after a normal install.
data = [
  "datasets>=2.18,<5",
  "kagglehub>=0.3,<1",
  "transformers>=4.40,<6",
  "pandas>=2,<4",
  "pyarrow>=15,<23",
  "pillow>=10,<13",
  "numpy>=1.26,<3"
]

# Kept as an empty compatibility extra. The Studio Cloud workspace now uses
# Hugging Face and GitHub, which need no provider-specific cloud SDK packages.
cloud = []

serve = [
  "pyngrok>=7.2,<8"
]


dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
]

[tool.pytest.ini_options]
markers = [
  "integration: tests that require an installed MLBricks runtime",
]


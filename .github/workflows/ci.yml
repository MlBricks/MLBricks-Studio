name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Studio and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest -q

      - name: Check JavaScript syntax
        run: node --check src/mlb_studio/static/builder.js

      - name: Build package
        run: python -m build
